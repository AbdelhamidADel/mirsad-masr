name: Docker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_URL" ]; then
            echo "DOKPLOY_DEPLOY_URL not set; skipping Dokploy trigger"
            exit 0
          fi
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --data '{
              "ref": "refs/heads/main",
              "repository": { "full_name": "'"$GITHUB_REPOSITORY"'" },
              "head_commit": {
                "id": "'"$SHA"'",
                "message": "Docker image published by GitHub Actions"
              },
              "commits": [
                {
                  "id": "'"$SHA"'",
                  "message": "Docker image published by GitHub Actions",
                  "modified": []
                }
              ]
            }' \
            "$DOKPLOY_DEPLOY_URL"
