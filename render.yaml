# MIRSAD MASR — Render Blueprint (Free Web Service)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mirsad-masr
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/health
    envVars:
      - key: ENABLE_YAHOO_FINANCE
        value: "false"
      - key: CACHE_TTL_SECONDS
        value: "30"
      - key: DEV_MODE
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: "*"
      - key: FETCH_QUOTES_ON_STARTUP
        value: "true"
      - key: AUTO_REFRESH_QUOTES
        value: "true"
      # Keep false until Neon DATABASE_URL + Gmail App Password SMTP_* are set in the dashboard.
      - key: ALERTS_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      # Gmail address + 16-char App Password (Google Account → Security → App passwords).
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Public site origin used inside confirmation emails, e.g. https://egxdesk.ashh.me
      - key: ALERTS_PUBLIC_BASE_URL
        sync: false
      - key: ALERTS_TICK_SECRET
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: FINNHUB_KEY
        sync: false
      - key: DEMO_ALPHA_VANTAGE_KEY
        sync: false
      - key: DEMO_FINNHUB_KEY
        sync: false
